{% if breadcrumbs|default([]) %}
<nav class="site-nav">
    {% for crumb in breadcrumbs %}
    {% if not loop.last %}
    <a href="{{ crumb.href }}">{{ crumb.title }}</a> &gt;
    {% else %}
    <span>{{ crumb.title }}</span>
    {% endif %}
    {% endfor %}
</nav>
{% else %}
<nav class="site-nav">
    <a href="index.html">{{ project.title }}</a>
</nav>
{% endif %}
